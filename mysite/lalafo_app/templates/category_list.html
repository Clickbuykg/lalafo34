<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Категории</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1020;--card:#1a1c36;--card-2:#22254a;--text:#f2f3ff;--muted:#9a9dc0;
  --border:#2a2d52;--primary:#7c6cff;--radius:24px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.container{width:min(1100px,100% - 40px);margin-inline:auto;padding:60px 0 80px}
.page-title{font-size:clamp(2rem,5vw,2.8rem);font-weight:800}
.page-sub{color:var(--muted);margin:10px 0 40px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{display:block;background:var(--card);border-radius:var(--radius);overflow:hidden;
  border:1px solid transparent;transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-8px);border-color:var(--border);box-shadow:0 20px 45px rgba(124,108,255,.25)}
.card__img{height:260px;position:relative;overflow:hidden;background:var(--card-2)}
.card__img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card__img img{transform:scale(1.07)}
.card__foot{display:flex;justify-content:space-between;align-items:center;padding:22px}
.card__name{font-weight:700;font-size:1.05rem}
.arrow{color:var(--primary);font-size:1.3rem;transition:transform .3s}
.card:hover .arrow{transform:translateX(6px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0;background:var(--card);border-radius:var(--radius)}

@media(max-width:760px){
  .container{padding:36px 0 60px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .card__img{height:150px}
  .card__foot{padding:14px}
}
</style>
</head>
<body>
<div class="container">
  <h1 class="page-title">Категории</h1>
  <p class="page-sub">Выберите интересующую вас категорию</p>

  <div class="grid">
    {% for c in categories %}
      <a class="card" href="#">
        <div class="card__img">
          {% if c.category_image %}
            <img src="{{ c.category_image.url }}" alt="{{ c.category_name }}">
          {% endif %}
        </div>
        <div class="card__foot">
          <span class="card__name">{{ c.category_name }}</span>
          <span class="arrow">→</span>
        </div>
      </a>
    {% empty %}
      <div class="empty">Категорий пока нет. Добавьте их в админке.</div>
    {% endfor %}
  </div>
</div>
</body>
</html>
